services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bugbounty.db
      - CACHE_TTL_SECONDS=3600
      - REFRESH_INTERVAL_SECONDS=3600
    volumes:
      - db-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
